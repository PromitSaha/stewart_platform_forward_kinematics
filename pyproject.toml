[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stewart-platform-forward-kinematics"
version = "0.1.0"
description = "Dataset generation and forward-kinematics experiments for a Stewart platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["inverse_kinematics*"]
